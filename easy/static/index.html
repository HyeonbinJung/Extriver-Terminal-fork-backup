<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fincept Terminal Easy</title>
<link rel="stylesheet" href="css/fincept.css">
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/lightweight-charts.js"></script>
<script src="js/core.js"></script>
</head>
<body>
<div class="menubar">
  <div class="menu"><button>File</button><div class="menu-pop">
    <div class="mi" data-go="guide">기능 안내 · 사용법</div>
    <div class="mi" onclick="location.reload()">새로고침<span class="k">F5</span></div>
  </div></div>
  <div class="menu"><button>Navigate</button><div class="menu-pop" id="navMenu"></div></div>
  <div class="menu hide-sm"><button>Help</button><div class="menu-pop" id="cmdMenu"></div></div>
  <label class="cmd" title="종목 코드·회사명 또는 /명령 입력 (Ctrl+K)"><span>&gt;</span><input id="cmdInput" placeholder="Enter Command  (예: AAPL, 005930.KS, /fx)" autocomplete="off" spellcheck="false"><div class="cmd-sug" id="cmdSug"></div></label>
  <span class="sep hide-sm">|</span>
  <span class="brand"><span class="f">FINCEPT</span> TERMINAL</span>
  <span class="sep hide-sm">|</span>
  <span class="desk">EASY · 한국어 리서치 데스크</span>
  <div class="right">
    <span class="live">LIVE</span>
    <span class="clock" id="clock"></span>
    <span class="sep hide-sm">|</span>
    <span class="c-green hide-sm">KEYLESS</span>
    <button class="btn-box hide-sm" data-go="guide">? 도움말</button>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="ticker" id="ticker"></div>
<main class="workspace" id="workspace"><div class="loading">터미널을 불러오는 중…</div></main>
<footer class="statusbar">
  <span>v4.5.1-easy</span><span class="sep">|</span><span>EQ FX CM FI CR</span><span class="sep">|</span>
  <span>SCREEN: <span class="c-orange" id="sbScreen">—</span></span>
  <span class="hide-sm">SESSION: <span class="c-cyan" id="sbSession">00:00:00</span></span>
  <span class="hide-sm">FEEDS: <span id="sbFeed">…</span></span>
  <span class="msg" id="sbMsg"></span>
  <span class="ready" id="sbReady">READY</span>
</footer>
<div id="tip"></div><div id="toast"></div>
<script>
(async () => {
  let files = [];
  try { files = (await (await fetch("/api/screens")).json()).files || []; } catch {}
  for (const f of files) {
    await new Promise(res => { const s = document.createElement("script"); s.src = "js/screens/" + f; s.onload = res; s.onerror = () => { console.error("failed", f); res(); }; document.head.appendChild(s); });
  }
  FE.start();
})();
</script>
</body>
</html>
